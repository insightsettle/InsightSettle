name: Web app checks

on:
  push:
    branches: [main]
    paths-ignore: ["mobile/**"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile || bun install
      # When a dependency was added without its lockfile entry (no registry access in the authoring session),
      # commit the refreshed bun.lock so Lovable and later runs install exactly the same versions.
      - name: Commit refreshed lockfile
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "insight-ci"; git config user.email "ci@insightsettle.com"
            git add bun.lock && git commit -m "chore: refresh bun.lock after dependency change" && git push
            echo "::notice title=lockfile::bun.lock refreshed and committed"
          fi
      - name: Typecheck
        run: set -o pipefail; npx tsc --noEmit -p . 2>&1 | tee tsc.log
      - name: Tests
        run: set -o pipefail; npx vitest run --reporter=verbose 2>&1 | tee test.log
      - name: Build
        run: npx vite build 2>&1 | tail -40 | tee build.log
      - name: Summary
        if: always()
        run: |
          echo "::notice title=typecheck::$(grep -c 'error TS' tsc.log || true) TypeScript errors"
          echo "::notice title=tests::$(grep -E 'Test Files|Tests ' test.log | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g')"
          echo "::notice title=build::$(grep -E 'built in|error' build.log | tail -2 | tr '\n' ' ')"
          f=$(grep -E ' (FAIL|×) ' test.log | head -20 | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g'); [ -n "$f" ] && echo "::error title=failed tests::$f" || true
