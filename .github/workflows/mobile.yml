name: Mobile app (Flutter)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get 2>&1 | tee ../pub.log
      - name: Report packages failure
        if: failure()
        run: msg=$(tail -c 6000 ../pub.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=pub get::$msg"

      - name: Prepare platforms
        run: bash tool/prepare_platforms.sh 2>&1 | tee ../prepare.log
      - name: Report platform failure
        if: failure()
        run: msg=$(tail -c 6000 ../prepare.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=prepare::$msg"

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.log
      - name: Report analyze issues
        if: always()
        run: |
          if grep -qE "(error|warning) •" ../analyze.log 2>/dev/null; then
            msg=$(grep -E "(error|warning|info) •" ../analyze.log | head -c 7000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=analyze::$msg"
          fi
          if grep -qE "info •" ../analyze.log 2>/dev/null; then
            msg=$(grep -E "info •" ../analyze.log | head -c 4000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=analyze infos::$msg"
          fi

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.log
      - name: Report test failures
        if: failure()
        run: msg=$(grep -vE "^\s*$" ../test.log | tail -c 7000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=test::$msg"

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../apk.log
      - name: Report APK failure
        if: failure()
        run: msg=$(tail -c 7000 ../apk.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=apk::$msg"

      - name: Build web
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee ../web.log
      - name: Report web failure
        if: failure()
        run: msg=$(tail -c 7000 ../web.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=web::$msg"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: insight-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: insight-web-build
          path: mobile/build/web
          retention-days: 14
      - name: Summary
        run: |
          ls -la build/app/outputs/flutter-apk/
          echo "::notice title=build::APK $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) built from $(git rev-parse --short HEAD)"
