name: Live site probe

# Manual check of the published site from GitHub's network: status per page, plus phone-size screenshots
# of the public pages (no sign-in), uploaded as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe pages
        run: |
          for p in / /auth /pricing /faq /help /how-it-works /welcome /robots.txt; do
            r=$(curl -sS -m 45 -o /tmp/body -w "%{http_code} %{time_total}s %{size_download}B" "https://insightsettle.com$p" 2>&1 || true)
            echo "::notice title=$p::$r"
          done
      - name: Screenshots
        run: |
          mkdir -p shots && cd shots && npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          const page = await ctx.newPage();
          for (const [name, path] of [['home', '/'], ['how', '/how-it-works'], ['pricing', '/pricing'], ['faq', '/faq']]) {
            await page.goto('https://insightsettle.com' + path, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1500);
            await page.screenshot({ path: `${name}_top.png` });
            for (let i = 1; i <= 4; i++) { await page.mouse.wheel(0, 760); await page.waitForTimeout(1800); await page.screenshot({ path: `${name}_${i}.png` }); }
          }
          await b.close();
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-screens
          path: shots/*.png
          retention-days: 7
